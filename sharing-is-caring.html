        body {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            height: 100%;

        html {
            height: 100%;
        }

        .image-container {
            aspect-ratio: 14/18;
            position: relative;
        }

        .product-badge {
            backdrop-filter: blur(10px);
            animation: fadeInDown 0.6s ease-out;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fade-in-up {
            animation: fadeInUp 0.6s ease-out;
        }

        .thumbnail-btn.active {
            border-width: 3px;
            transform: scale(1.05);
        }

        .color-btn.active {
            border-width: 4px;
            transform: scale(1.1);
        }

        .size-btn.active {
            border-width: 3px;
        }

        .gradient-text {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .shine-effect {
            position: relative;
            overflow: hidden;
        }

        .shine-effect::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            animation: shine 3s infinite;
        }

        @keyframes shine {
            to {
                left: 200%;
            }
        }
        .color-swatch {
          transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .color-swatch:hover {
          transform: scale(1.1);
          box-shadow: 0 0 10px rgba(0,0,0,0.15);
        }

        .color-swatch.selected {
          border-color: #3b82f6 !important; /* blue-500 */

        }

    </style>

<script>
  const defaultConfig = {
    product_title: "Sharing is Caring",
    /* ĐÃ BỎ product_badge */
    color_section_title: "Chọn màu sắc:",
    size_section_title: "Chọn kích thước:",
    background_color: "#f8fafc",
    primary_color: "#667eea",
    text_color: "#1f2937",
    accent_color: "#764ba2",
    button_color: "#3b82f6"
  };

  let config = { ...defaultConfig };

  
  function selectSize(button) {
    document.querySelectorAll('.size-btn').forEach(btn => {
      btn.classList.remove('active', 'border-blue-500', 'bg-blue-50', 'text-blue-700', 'font-bold', 'shadow-md');
      btn.classList.add('border-2', 'border-gray-200', 'text-gray-700', 'font-semibold');
    });

    button.classList.add('active', 'border-blue-500', 'bg-blue-50', 'text-blue-700', 'font-bold', 'shadow-md');
    button.classList.remove('border-2', 'border-gray-200', 'font-semibold');
  }

  async function onConfigChange(newConfig) {
    const productTitle = document.getElementById('productTitle');
    const colorSectionTitle = document.getElementById('colorSectionTitle');
    const sizeSectionTitle = document.getElementById('sizeSectionTitle');

    if (productTitle) {
      productTitle.textContent = newConfig.product_title || defaultConfig.product_title;
    }
    if (colorSectionTitle) {
      colorSectionTitle.textContent = newConfig.color_section_title || defaultConfig.color_section_title;
    }
    if (sizeSectionTitle) {
      sizeSectionTitle.textContent = newConfig.size_section_title || defaultConfig.size_section_title;
    }

    document.body.style.backgroundColor = newConfig.background_color || defaultConfig.background_color;
  }

  function mapToCapabilities(config) {
    return {
      recolorables: [
        {
          get: () => config.background_color || defaultConfig.background_color,
          set: (value) => {
            config.background_color = value;
            window.elementSdk.setConfig({ background_color: value });
          }
        },
        {
          get: () => config.primary_color || defaultConfig.primary_color,
          set: (value) => {
            config.primary_color = value;
            window.elementSdk.setConfig({ primary_color: value });
          }
        },
        {
          get: () => config.text_color || defaultConfig.text_color,
          set: (value) => {
            config.text_color = value;
            window.elementSdk.setConfig({ text_color: value });
          }
        }
      ],
      borderables: [],
      fontEditable: undefined,
      fontSizeable: undefined
    };
  }

  function mapToEditPanelValues(config) {
    return new Map([
      ["product_title", config.product_title || defaultConfig.product_title],
      ["color_section_title", config.color_section_title || defaultConfig.color_section_title],
      ["size_section_title", config.size_section_title || defaultConfig.size_section_title]
      // ĐÃ BỎ product_badge khỏi panel
    ]);
  }

  if (window.elementSdk) {
    window.elementSdk.init({
      defaultConfig,
      onConfigChange,
      mapToCapabilities,
      mapToEditPanelValues
    });
    config = window.elementSdk.config;
  }

  onConfigChange(config);
  // Chọn màu bằng swatch & đổi ảnh
document.querySelectorAll('.color-swatch').forEach(swatch => {
  swatch.addEventListener('click', function () {

    // Bỏ selected khỏi tất cả
    document.querySelectorAll('.color-swatch').forEach(s => {
      s.classList.remove('selected');
      s.style.borderColor = "#d1d5db"; // gray-300
    });

    // Thêm selected cho swatch được chọn
    this.classList.add('selected');
    this.style.borderColor = "#3b82f6"; // blue-500

    // Đổi ảnh chính
    const newImg = this.getAttribute('data-image');
    const mainImage = document.getElementById("mainImage");

    if (newImg && mainImage) {
      mainImage.src = newImg;
    }
  });
});
// Xử lý khi bấm nút "Mua hàng"
const buyButton = document.getElementById('buyButton');
const orderMessage = document.getElementById('orderMessage');

if (buyButton && orderMessage) {
  buyButton.addEventListener('click', () => {
    orderMessage.textContent = "Xác nhận đơn hàng thành công";
    orderMessage.classList.remove('hidden');
  });
}

</script>
